name: schemeguard-ai

services:
  db:
    image: schemeguard-postgres:16-pgvector-0.8.7
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schemeguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-schemeguard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    environment: &backend_environment
      PROFILE_ENCRYPTION_KEY: ${PROFILE_ENCRYPTION_KEY:-}
      CITIZEN_SESSION_HOURS: ${CITIZEN_SESSION_HOURS:-8}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKER_JOB_ATTEMPTS: ${WORKER_JOB_ATTEMPTS:-4}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-600}
      MONITORING_DISPATCH_SECONDS: ${MONITORING_DISPATCH_SECONDS:-30}
      POSTGRES_USER: ${POSTGRES_USER:-schemeguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-schemeguard}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      SEED_DATA_PATH: ${SEED_DATA_PATH:-/app/data/schemes}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DOCUMENT_STORAGE_ROOT: /var/lib/schemeguard/documents
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-20}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-2}
      GEMINI_MAX_REQUESTS: ${GEMINI_MAX_REQUESTS:-6}
      GEMINI_MAX_INPUT_CHARS: ${GEMINI_MAX_INPUT_CHARS:-20000}
      PDF_MAX_BYTES: ${PDF_MAX_BYTES:-10485760}
      PDF_MAX_PAGES: ${PDF_MAX_PAGES:-50}
      PDF_PARSE_TIMEOUT: ${PDF_PARSE_TIMEOUT:-25}
      PDF_MAX_TEXT_CHARS: ${PDF_MAX_TEXT_CHARS:-200000}
      DOCUMENT_DOWNLOAD_TIMEOUT: ${DOCUMENT_DOWNLOAD_TIMEOUT:-15}
      CHUNK_SIZE: ${CHUNK_SIZE:-1800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-160}
      PROCESSING_TIMEOUT: ${PROCESSING_TIMEOUT:-90}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-8}
      ADMIN_LOGIN_LIMIT: ${ADMIN_LOGIN_LIMIT:-10}
      ADMIN_RATE_WINDOW_SECONDS: ${ADMIN_RATE_WINDOW_SECONDS:-900}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-["http://localhost:3000"]}
      WORKFLOW_TIMEOUT: ${WORKFLOW_TIMEOUT:-150}
      WORKFLOW_MAX_ATTEMPTS: ${WORKFLOW_MAX_ATTEMPTS:-3}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMENSIONS: "768"
      EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-20}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-2}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MAX_CHUNKS: ${RAG_MAX_CHUNKS:-500}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.3}
      EXPLANATION_USE_GEMINI: ${EXPLANATION_USE_GEMINI:-false}
      LANGSMITH_TRACING: "false"
      LANGSMITH_TRACING_V2: "false"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data:ro
      - document_data:/var/lib/schemeguard/documents
    networks:
      - backend
      - ingress
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload", "--no-access-log", "--log-config", "/app/logging.json"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-["http://localhost:3000"]}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    networks:
      - ingress
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    init: true
    restart: unless-stopped


  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    image: schemeguard-ai-api
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    entrypoint: ["celery", "-A", "app.workers.celery_app:celery_app"]
    command: ["worker", "--loglevel=INFO", "--concurrency=2", "--queues=monitoring,documents", "--hostname=worker@%h"]
    environment: *backend_environment
    volumes:
      - ./backend:/app
      - ./data:/app/data:ro
      - document_data:/var/lib/schemeguard/documents
    networks: [backend, ingress]
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping --destination worker@$$HOSTNAME --timeout 4 | grep -q pong"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    stop_grace_period: 9m
    init: true
    restart: unless-stopped

  scheduler:
    image: schemeguard-ai-api
    entrypoint: ["python", "-m", "app.workers.scheduler"]
    environment: *backend_environment
    volumes:
      - ./backend:/app
    networks: [backend]
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import time,pathlib; assert time.time()-float(pathlib.Path('/tmp/schemeguard-beat-heartbeat').read_text())<90"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 5
    init: true
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  frontend_node_modules:
  frontend_next:
  document_data:

networks:
  backend:
    internal: true
  ingress:
