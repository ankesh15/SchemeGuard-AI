[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "schemeguard-backend"
version = "0.1.0"
description = "Source-grounded government scholarship discovery API"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.162.4",
    "uvicorn==0.54.0",
    "SQLAlchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "PyMuPDF==1.28.2",
    "google-genai==3.2.0",
    "argon2-cffi==25.1.0",
    "langgraph==1.2.21",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary,pool]==3.3.9",
    "pgvector==0.5.1",
    "celery[redis]==5.7.0",
    "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "httpx==0.28.1",
    "ruff==0.17.4",
    "mypy==2.4.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
cache_dir = "/tmp/schemeguard-pytest-cache"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
